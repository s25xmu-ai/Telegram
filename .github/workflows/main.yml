name: Build XGram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive || true
          ls -la TMessagesProj_Modules/media | head -20 || true
          test -f TMessagesProj_Modules/media/core_settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Setup config files
        run: |
          [ -f gradle.properties.example ] && cp gradle.properties.example gradle.properties || touch gradle.properties
          [ -f local.properties.example ] && cp local.properties.example local.properties || touch local.properties
          echo "TELEGRAM_APP_ID=33758413" >> local.properties
          echo "TELEGRAM_APP_HASH=e9fe420e4e170ff123fd27c3f63c440e" >> local.properties

      - name: Prepare signing keystore (stored in repo)
        run: |
          mkdir -p signing TMessagesProj/config

          if [ -f signing/xgram.keystore ] && [ -f signing/keystore.properties ]; then
            echo "Found existing keystore committed in the repo, reusing it."
          else
            echo "No keystore found in repo, generating a new one and committing it."
            ALIAS="xgram"
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"

            keytool -genkey -keystore signing/xgram.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=XGram,O=RK,C=IR"

            cat > signing/keystore.properties << EOF
          KEY_ALIAS=$ALIAS
          KEY_PASSWORD=$PASS
          STORE_PASSWORD=$PASS
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add signing/xgram.keystore signing/keystore.properties
            git commit -m "chore: add signing keystore [skip ci]"
            git push
          fi

          cp signing/xgram.keystore TMessagesProj/config/release.keystore
          set -a
          source signing/keystore.properties
          set +a

          sed -i '/^RELEASE_KEY_ALIAS=/d;/^RELEASE_KEY_PASSWORD=/d;/^RELEASE_STORE_PASSWORD=/d' gradle.properties
          {
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          } >> gradle.properties

          keytool -list -v -keystore TMessagesProj/config/release.keystore -storepass "$STORE_PASSWORD" | grep -E "Alias name|SHA-256|SHA256"

      - name: Setup google-services.json
        run: |
          python3 - << 'PYEOF'
          import json
          bases = ["org.telegram.messenger", "me.chat_t.messenger", "me.xgram.messenger"]
          suffixes = ["", ".beta", ".web"]
          clients = []
          n = 0
          for b in bases:
              for s in suffixes:
                  n += 1
                  clients.append({
                      "client_info": {
                          "mobilesdk_app_id": "1:1:android:a%d" % n,
                          "android_client_info": {"package_name": b + s}
                      },
                      "api_key": [{"current_key": "test"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  })
          data = {
              "project_info": {
                  "project_id": "xgram",
                  "project_number": "1",
                  "firebase_url": "https://xgram.firebaseio.com",
                  "storage_bucket": "xgram.appspot.com"
              },
              "client": clients,
              "configuration_version": "1"
          }
          with open("/tmp/google-services.json", "w") as f:
              json.dump(data, f)
          PYEOF
          find . -name "google-services.json" -not -path "*/build/*" -not -path "./.git/*" -exec cp /tmp/google-services.json {} \;
          for d in TMessagesProj TMessagesProj_App TMessagesProj_AppStandalone; do
            if [ -d "$d" ]; then cp /tmp/google-services.json "$d/google-services.json"; fi
          done

      - name: Enable buildConfig
        run: |
          if ! grep -qE "buildConfig[[:space:]]*(=[[:space:]]*)?true" TMessagesProj/build.gradle; then
            sed -i '/android {/a\    buildFeatures { buildConfig true }' TMessagesProj/build.gradle
          fi

      - name: Rename Telegram to XGram
        run: |
          find . -name "strings.xml" -not -path "*/build/*" -print0 | xargs -0 -r perl -0pi -e 's/>([^<]*)</">" . ($1 =~ s{Telegram}{XGram}gr) . "<"/ge'

      - name: Rename package name
        run: |
          grep -rl --include="*.gradle" --include="gradle.properties" --include="AndroidManifest.xml" --include="*.java" --include="*.kt" --include="*.xml" --exclude-dir=build --exclude-dir=.git --exclude-dir=.gradle "me.chat_t.messenger" . | xargs -r sed -i 's/me\.chat_t\.messenger/me.xgram.messenger/g' || true

      - name: Set default app icon
        run: |
          which convert >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y imagemagick)

          SRC="TMessagesProj/src/main/res/mipmap-hdpi/ic_launcher.png"
          if [ ! -f "$SRC" ]; then
            echo "Source icon $SRC not found, skipping."
            exit 0
          fi

          SRC_SIZE=$(identify -format "%w" "$SRC")
          echo "Source icon size: ${SRC_SIZE}px (from mipmap-hdpi, density factor 1.5)"

          declare -A FACTORS=( [mdpi]=1 [hdpi]=1.5 [xhdpi]=2 [xxhdpi]=3 [xxxhdpi]=4 )

          for density in "${!FACTORS[@]}"; do
            factor="${FACTORS[$density]}"
            size=$(python3 -c "print(round($SRC_SIZE * $factor / 1.5))")
            dir="TMessagesProj/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            for name in ic_launcher.png ic_launcher_round.png; do
              convert "$SRC" -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/$name"
              echo "wrote $dir/$name (${size}x${size})"
            done
          done

          # Adaptive icons (API 26+) take priority over the plain mipmap pngs above.
          # If this repo defines them, point the foreground layer at the same source image too.
          for xml in TMessagesProj/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml; do
            [ -f "$xml" ] || continue
            fg=$(grep -oE 'mipmap/[a-zA-Z0-9_]+' "$xml" | grep -i foreground | head -1 | cut -d/ -f2)
            if [ -n "$fg" ]; then
              for density in "${!FACTORS[@]}"; do
                factor="${FACTORS[$density]}"
                size=$(python3 -c "print(round($SRC_SIZE * $factor / 1.5))")
                dir="TMessagesProj/src/main/res/mipmap-$density"
                mkdir -p "$dir"
                convert "$SRC" -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/$fg.png"
              done
              echo "Also overrode adaptive icon foreground: $fg"
            fi
          done

      - name: Disable lint tasks
        run: |
          cat > /tmp/nolint.gradle << 'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.startsWith("lint")) {
                      task.enabled = false
                  }
              }
          }
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew -I /tmp/nolint.gradle :TMessagesProj_App:assembleAfatRelease --no-daemon -x lint --stacktrace --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: |
          grep -nE "What went wrong|FAILED|error:|e: file|fatal error|undefined reference" -A6 build.log | head -120

      - name: Show APK signing certificate
        if: always()
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for f in $(find . -path "*/outputs/apk/*" -name "*.apk"); do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" 2>&1 | grep -E "SHA-256" || true
          done
          true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
